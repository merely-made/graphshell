# The hosting workspace (engine split P3, D37): the host layer above the contract
# root in ../crates. Its own lock; the root workspace excludes this directory.
# Moved crates keep Mere's subpaths. Mere crates that have not moved yet are
# named from mere.git; the contract root's crates by path, and patched over
# graphshell.git so Mere's and Inker's rows for them resolve to the same source.

[workspace]
resolver = "2"
members = [
    "ports/tabard/workshop",
    "crates/script/document-host",
    "crates/system/ux-events",
    "crates/graphshell/graphshell-client-tests",
    "ports/pelt/desktop",
    "crates/cambium/backstep",
    "crates/cambium/cambium",
    "crates/cambium/cambium-genet-web-host",
    "crates/cambium/cambium-genet-winit-host",
    "crates/cambium/cambium-rootstock",
    "crates/cambium/cambium-winit",
    "crates/cambium/cambium-winit-a11y",
    "crates/cambium/mandrake",
    "crates/cambium/mere-overmap",
    "crates/cambium/mere-view",
    "crates/cambium/meristem",
    "crates/cambium/scenes/scenograph",
    "crates/cambium/scenes/scenomise",
    "crates/cambium/sprigging",
    "crates/cambium/workbench",
    "crates/canvas/cartography",
    "crates/forme/uxtree",
    "crates/graphshell/graphshell-door",
    "crates/graphshell/graphshell-host",
    "crates/incipit",
    "crates/platen/platen",
    "crates/script/app-host",
    "crates/script/authority-host",
    "crates/script/block-adapter",
    "crates/script/block-host",
    "crates/system/djinn-testkit",
    "crates/system/fetch",
    "crates/system/registry",
    "crates/system/settings-wit",
    "crates/system/surface-api",
    "crates/system/tabard",
    "ports/mere-resident",
    "ports/moot",
    "ports/pelt/core",
]
exclude = [
    "support/patches/light-file-dialog",
]

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/graphshell"
authors = ["Mark AB (markik)"]

[workspace.dependencies]
murm-sync = { version = "0.0.1", git = "https://github.com/merely-made/murm.git", branch = "main" }
# The application door's contract: wire, frames, routes, declarations and the
# client (Armillary's djinn-slimming S2).
ostiary = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", branch = "main", default-features = false }
# Independent application door and resident lifetime supplier.
djinn = { version = "0.0.3", git = "https://github.com/merely-made/armillary.git", branch = "main", default-features = false }
# OS peer facts shared with Djinn's door (capability door plan D7).
peer-facts = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", branch = "main" }

cue-netrender = { git = "https://github.com/merely-made/wgpu-cue.git", branch = "main" }
webcue = { git = "https://github.com/merely-made/wgpu-cue.git", branch = "main" }
wgpu-cue = { git = "https://github.com/merely-made/wgpu-cue.git", branch = "main" }
# ─── Workspace-internal path deps ────────────────────────────────────────────
# Every workspace member listed here; consumers do `dep.workspace = true`
# so only the root Cargo.toml knows where each crate lives. Package names
# below are the *current* names — rename passes (drop mere-* prefix etc.)
# update both this list and consumer references in one shot.
# Seiche and numen come from merely-made/seiche (engine split plan, P2). The
# default field evaluation path stays portable; optional Burn/Rhai/Resident
# carriage is selected at the owning crate.
seiche = { version = "0.0.6", git = "https://github.com/merely-made/seiche.git", branch = "main", default-features = false }
cartography = { package = "mere-cartography", version = "0.0.2", path = "crates/canvas/cartography" }
linked-data = { package = "mere", version = "0.1.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
kernel = { package = "mere-kernel", version = "0.0.3", git = "https://github.com/merely-made/mere.git", branch = "main" }
# The graph-canvas content-root (was `orrery`; that name retired to the Merely
# product tier ladder, 2026-07-09 — see the boundary pass plan amendments).
pictograph = { version = "0.2.0", git = "https://github.com/merely-made/emblem.git", branch = "main", default-features = false }
# The IconVG implementation pictograph encodes faces with (repos/emblem).
emblem = { git = "https://github.com/merely-made/emblem.git", branch = "main" }
# Graph digest projections (djot outline, metrics) — `glossary` (was `mere-orrery`).

# The actor-kernel runtime (host-neutral): the !Send host-kernel boundary + the
# Send actor harness the constellation is built on. Promoted to its standalone
# repo (code-identical cutover 2026-07-09, boundary pass slice A); git sibling
# consumed one-way, local checkout via the gitignored `.cargo/config.toml` patch.
armillary = { version = "0.1.1", git = "https://github.com/merely-made/armillary.git", branch = "main" }
# The scenograph projection-engine family's core contract (scene snapshots,
# footprints, spaces, measurements) — git sibling consumed one-way, local
# checkout via the gitignored `.cargo/config.toml` patch. cartography emits
# sceno scenes (the P2 consumption slice; projection_proofs_plan).
sceno = { version = "0.0.7", path = "../crates/sceno" }
sceno-backdrops = { version = "0.0.1", path = "../crates/sceno-backdrops" }
scenomise = { version = "0.0.7", path = "crates/cambium/scenes/scenomise" }
scenotime = { version = "0.0.5", path = "../crates/scenotime" }
scenograph = { version = "0.0.6", path = "crates/cambium/scenes/scenograph" }
# The remaining families absorbed 2026-07-23. Consumers keep using
# `<dep>.workspace = true`, so only this block knows where each one lives.
# The identity tier lives in merely-made/dramatis since DR-D (dramatis repo
# plan). Every entry names the SAME revision: two revisions are two sources,
# and two personae in one graph split its types. A sibling that embeds in
# this graph (Knot, through djinn) must pin the same revision too. Until
# dramatis is pushed, the gitignored `.cargo/config.toml` patches these to a
# local checkout.
personae = { version = "0.3.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
notochord = { version = "0.1.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
fieldbook = { version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
hodograph = { version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
portolan = { version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# The legend/memorial view over journals and codicils; reservation only.
hagiograph = { version = "0.0.1", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
numen = { version = "0.2.1", git = "https://github.com/merely-made/seiche.git", branch = "main" }
esp = { version = "0.1.0", git = "https://github.com/merely-made/distillery.git", branch = "main" }
# Fixture data is a dev-only supplier package; keep the runtime cohort unchanged.
esp-testkit = { version = "0.1.0", git = "https://github.com/merely-made/distillery.git", branch = "main" }
# The projection contract, executed in duplicate (was graphshell-protocol;
# renamed 2026-08-14 because the contract is the family's, not the portal's).
chirograph = { version = "0.0.5", path = "../crates/chirograph" }
# The card vocabulary chirograph re-exports and castellan wants without the wire.
graphshell-client = { version = "0.0.2", path = "../crates/graphshell-client" }
graphshell-endpoint = { version = "0.0.4", path = "../crates/graphshell-endpoint" }
graphshell-door = { version = "0.0.1", path = "crates/graphshell/graphshell-door" }
# The serving half: admission, the session loop, the catalog and the projection
# host (Graphshell stack lift plan, L2, ruling R4). Default features off here;
# each consumer names the half it serves.
graphshell-host = { version = "0.0.2", path = "crates/graphshell/graphshell-host", default-features = false }
# The credential-keeper port (dramatis plan D4). No longer a reservation:
# C1/C2 landed the OTP core, sealed OTP items, the release gate, and the
# `keeper` identity surface graphshell re-exports.
castellan = { version = "0.0.4", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
sporran = { version = "0.0.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
custody-wire = { version = "0.0.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
djinn-custodian = { version = "0.0.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
# The model-works port; first real consumer of the mesh host supervisor.
distillery = { version = "0.0.1", git = "https://github.com/merely-made/distillery.git", branch = "main" }
# The places port: one port, two surfaces (murmur = conversation, moot =
# community), composing gemot, commons, murm, and stickleback without owning
# their authority. Founding reservation, no implementation. Package is
# `mere-moot` because crates.io `moot` and `murmur` are both held elsewhere.
moot = { package = "mere-moot", version = "0.0.1", path = "ports/moot" }
athanor = { package = "mere-athanor", version = "0.0.1", git = "https://github.com/merely-made/distillery.git", branch = "main" }
# Shared pins the graphshell crates inherit.
base64 = "0.23"
blake3 = "1"
# One upstream ipc-channel across the family (capability door D10); never
# force-inprocess outside an application root.
ipc-channel = "0.23.1"
# Exactly pinned: wit-parser states no API stability and ships a new 0.X
# with every wasm-tools release (capability door D17).
wit-parser = "=0.263.0"

fetch = { package = "mere-fetch", version = "0.0.1", path = "crates/system/fetch" }
page-load = { package = "mere-pageload", version = "0.0.1", git = "https://github.com/merely-made/inker.git", branch = "main" }
proofs = { package = "mere-proofs", version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
incipit = { version = "0.2.3", path = "crates/incipit" }
comms = { package = "mere-comms", version = "0.0.1", git = "https://github.com/merely-made/murm.git", branch = "main" }
# The reservoir service, split from pandect (engine split P4, D3, D9).
catchment = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
pandect = { version = "0.2.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
# Self-update over signed manifests (the cargo-packager-updater fork; ruled
# 2026-07-24: name luggage, home mere). Apps consume it via git dep like the
# rest of the family; mere itself will when its own packaging lands.
#
# `default-features = false` here is the release-identity core only. Cargo
# forbids a member turning a workspace dependency's defaults *off*, so the
# workspace declaration has to be the minimal common denominator and each
# member opts up. A member that wants the update pipeline writes
# `luggage = { workspace = true, features = ["native"] }`; forgetting to is a
# compile error naming the missing item, never a silently crippled updater.
# The crate's own `default = ["native"]` still serves consumers outside this
# workspace, which is who it is for.
luggage = { default-features = false, git = "https://github.com/merely-made/eidetic.git", branch = "main" }
registry = { package = "mere-registry", path = "crates/system/registry", default-features = false }

# The engine-management family moved to genet 2026-07-10, came back on
# 2026-09-03 under the platform boundary plan's P3, and left for
# merely-made/inker on 2026-11-07 (engine split plan, P1), with the smolweb
# lane, knot-editor-host, the document lanes, page-load, fleece and script-rhai.
inker = { version = "0.1.1", git = "https://github.com/merely-made/inker.git", branch = "main" }
document-canvas = { version = "0.1.0", git = "https://github.com/merely-made/inker.git", branch = "main" }
# `default-features = false` belongs on this declaration: the external
# knot-editor opts back into `html-fragment` explicitly.
nematic = { version = "0.1.1", git = "https://github.com/merely-made/inker.git", branch = "main", default-features = false }
fleece-extract = { package = "fleece", version = "0.5.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
fleece = { package = "mere-fleece", version = "0.0.1", git = "https://github.com/merely-made/inker.git", branch = "main" }
genet-text = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
illume = { version = "0.0.3", git = "https://github.com/merely-made/inker.git", branch = "main" }
# ─── Landed from genet 2026-09-03 (platform boundary plan, P2) ──────────────
# Workspace members, so path deps. None of the eleven may appear in
# .cargo/config.toml's genet patch table: patching a git source at a path that
# is also a workspace member is a hard lockfile collision.
cambium = { version = "0.6.1", path = "crates/cambium/cambium" }
cambium-rootstock = { version = "0.1.0", path = "crates/cambium/cambium-rootstock", default-features = false }
mandrake = { version = "0.1.0", path = "crates/cambium/mandrake" }
cambium-winit = { version = "0.3.0", path = "crates/cambium/cambium-winit" }
cambium-a11y = { version = "0.3.0", path = "crates/cambium/cambium-winit-a11y" }
cambium-web = { version = "0.1.0", path = "crates/cambium/cambium-genet-web-host" }
hest = { version = "0.2.1", path = "../crates/hest" }
backstep = { version = "0.2.0", path = "crates/cambium/backstep" }
meristem = { version = "0.2.0", path = "crates/cambium/meristem" }
sprigging = { version = "0.3.0", path = "crates/cambium/sprigging" }
# The three engine adapters, unpublished, from merely-made/inker.
scrying-engine = { version = "0.2.0", git = "https://github.com/merely-made/inker.git", branch = "main" }
graft-engine = { version = "0.2.0", git = "https://github.com/merely-made/inker.git", branch = "main" }
weld-engine = { version = "0.2.0", git = "https://github.com/merely-made/inker.git", branch = "main" }

# Centralized 2026-08-26. These were previously restated in each member with a
# full git spec, so a genet bump meant editing fifteen files and a missed one
# silently forked the lineage. Stated once here; members inherit with
# `foo.workspace = true` and add only their own features/optional flags.
genet-scripted-dom = { version = "0.1.2", git = "https://github.com/merely-made/genet.git", branch = "main" }
# Unpublished (0.0.0): native event dispatch plan, Phase 2 (cambium click, key and focus listeners).
genet-events = { version = "0.0.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
layout-dom-api = { version = "0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
layout_dom_api = { package = "layout-dom-api", version = "0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-livery = { version = "0.0.4", git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false }
# Named genet-probe until genet 7baa554c (2026-09-14); same crate, new name.
taproot = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false, features = ["accesskit"] }
genet-static-dom = { version = "0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
# The application half of the former `genet-host-api` — the settings
# projection and the surface admission vocabulary. Genet's P1 split it out as
# `mere-surface-api` (genet 57bcc38fdae, platform boundary plan §9.3), leaving
# `genet-host-api` at 0.2.0 as the raw engine half, which mere does not
# consume. The plan moved it here on 2026-09-03; it is a workspace member now.
mere-surface-api = { version = "0.1.1", path = "crates/system/surface-api" }
workbench = { version = "=0.1.1", path = "crates/cambium/workbench" }
mere-view = { version = "0.1.0", path = "crates/cambium/mere-view" }
mere-overmap = { version = "0.1.0", path = "crates/cambium/mere-overmap", default-features = false }
errand = { version = "0.4.0", git = "https://github.com/merely-made/errand.git", branch = "main" }
# Errand's wire layer: one spec-faithful crate per protocol, published under
# names that belong to the protocols' communities rather than to the engine
# that speaks them (the 2026-07-23 repo consolidation and the 2026-08-03
# smolweb home decision). They were genet's `[workspace.dependencies]` while
# errand lived there; they arrive here with it. `finger-protocol` carries
# WebFinger too, which errand deliberately does not enable, since WebFinger is
# HTTP and errand does not speak HTTP.
nex-protocol = { version = "0.1.1" }
spartan-protocol = { version = "0.1.1" }
guppy-protocol = { version = "0.1.1" }
gopher-protocol = { version = "0.2.0" }
gemini-protocol = { version = "0.1.7" }
scroll-protocol = { version = "0.1.0" }
finger-protocol = { version = "0.1.1", default-features = false, features = [
    "client",
] }
netfetcher = { version = "0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
# ─── Landed from genet 2026-09-03 (platform boundary plan, P3) ───────────────
# Workspace members, so path deps. None of these may appear in
# .cargo/config.toml's genet patch table.
pelt-core = { path = "ports/pelt/core" }
tabard = { version = "0.0.2", path = "crates/system/tabard" }
mere-lanes = { version = "0.1.0", git = "https://github.com/merely-made/inker.git", branch = "main" }

# Genet crates the landed ports reach. In genet these were relative paths into
# `components/`; here they are git pins at the same single revision as every
# other genet.git line in this file — the source-identity invariant (plan §8.7,
# §9.4). Package names that differ from the key are spelled out.
genet-host-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-documents = { git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false }
genet-document-resources = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-render = { git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false, features = ["livery", "accesskit"] }
# The present core (wgpu boot, surface format, Scene rasterization) every host
# stands on. Named here because the landed Cambium hosts reached it by relative
# path inside genet and now reach genet.git like the rest of the family.
genet-presenter = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-winit = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-scripted = { git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false }
document-session-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
cambium-desktop = { version = "0.1.0", path = "crates/cambium/cambium-genet-winit-host" }
genet-runtime = { git = "https://github.com/merely-made/genet.git", branch = "main" }
script-engine-api = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
# Deterministic maths for scripted rules (Scenograph editor plan, SE40, SE93). No
# default features: the host functions must give the same bits on every target.
libm = { version = "0.2", default-features = false }
genet-bole = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-vano = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# `servo-paint` was retired in genet 5af76a0cb8c; its platform compositor half
# (DXGI, CALayer, Wayland, HostWgpuContext, `default_compositor_for_window`)
# is `genet-compositor` with the public names unchanged, so the `paint` key
# and Pelt's `paint::` paths stay as they are.
paint = { package = "genet-compositor", git = "https://github.com/merely-made/genet.git", branch = "main" }
webgl_wgpu = { package = "genet-webgl", git = "https://github.com/merely-made/genet.git", branch = "main" }
# Tabard's dev-dependency: the owned static CSS/layout engine it renders its
# generated stylesheets through.
livery = { version = "0.0.5", git = "https://github.com/merely-made/genet.git", branch = "main" }
# The seed-palette engine, under its published name. `tincture` below is the
# SAME package under mere's historical alias; both must stay on this one
# source or the graph carries two incompatible `Tinct`s. Tinct lives in the
# Graphshell contract root since 2026-11-07 (engine split plan, D19).
tinct = { path = "../crates/tinct" }

netrender = { version = "=0.1.2", git = "https://github.com/merely-made/netrender.git", branch = "main" }
paint_list_api = { version = "=0.1.2", git = "https://github.com/merely-made/netrender.git", branch = "main" }
paint_list_render = { version = "=0.1.2", git = "https://github.com/merely-made/netrender.git", branch = "main" }

uxtree = { version = "0.0.2", path = "crates/forme/uxtree" }

platen = { version = "0.0.1", path = "crates/platen/platen" }
site-model = { package = "gemot-site", version = "0.1.0", git = "https://github.com/merely-made/gemot.git", branch = "main" }
personal-facts = { package = "mere-facts", version = "0.1.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
apparatus-core = { version = "0.1.0", git = "https://github.com/merely-made/armillary.git", branch = "main", default-features = false }
eidetic = { version = "0.0.3", default-features = false, features = ["product"], git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# Derived lexical recall is owned by Eidetic. Hosts supply the retained corpus
# and any vector rankings; model backends remain optional.
eidetic-search = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }

# Standalone spec-B misfin implementation (promoted out of this workspace
# 2026-07-03). It moved into the smolweb workspace in the 2026-07-23
# consolidation and its own repo was deleted, so this is a crates.io pin rather
# than a branch dep — genet's errand consumes it the same way. Held in
# stewardship, so the published crate is the stable face.
misfin = { version = "0.0.4", features = ["ring"] }
# The shared replicated-space runtime beneath every signed peer domain: joined
# spaces, policy-before-insert processing, operation storage, checkpoints,
# retention mechanics, and native drop carriage. Promoted out of the murm
# supercrate 2026-07-26 (it was `murm-replication`, but Murm, Mesh, Moot, and
# transport all consume it). Domains keep their own operation grammar,
# addressing, authorization, and materialization.
stickleback = { version = "0.2.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# Murm at fb6360c12b (main: the merge of 3d9e799f, the browser initiator's
# callback-lifetime fix, and 38e9c9b8, `TransportKind::InProcess`, so Djinn's
# local doors hand admission an `AcceptedSession`; lift plan pass (b)).
# Named through the `www` alias; see the Murm patch table below.
transport = { package = "mere-transport", version = "0.0.2", git = "https://github.com/merely-made/murm.git", branch = "main" }
murm-ocapn = { version = "0.1.0", git = "https://github.com/merely-made/murm.git", branch = "main" }
# The Wasm-clean half of the browser WebRTC carrier: bounded frames, invite
# ids, role-tagged DTLS fingerprints, and the link-challenge transcript that
# derives Notochord's `shared_link`. It depends on neither `transport` nor
# `notochord` on purpose; the browser build stays free of both, and the
# admission layers receive only a `[u8; 16]`.
webrtc-carrier = { package = "murm-webrtc", version = "0.0.1", git = "https://github.com/merely-made/murm.git", branch = "main" }

gemot = { version = "0.1.1", git = "https://github.com/merely-made/gemot.git", branch = "main" }
commons-spine = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
moothold = { version = "0.1.0", git = "https://github.com/merely-made/gemot.git", branch = "main" }
mooting = { version = "0.1.0", git = "https://github.com/merely-made/gemot.git", branch = "main" }
mien = { version = "0.0.1", git = "https://github.com/merely-made/gemot.git", branch = "main" }

# The personal-space compute mesh (resource-coordination M1): signed job ops
# over the Standing-proven LogSync lane + the deterministic job board.
mesh = { package = "mere-mesh", git = "https://github.com/merely-made/distillery.git", branch = "main" }
# The host supervisor above the mesh (host lanes plan, gate H0): owns in-flight
# jobs, their control handles, and the OS-facing condition/clock seams that
# `mere-mesh` deliberately refuses to have.

# The same crate as `personae` above, under mere's historical alias. Both
# entries must carry the SAME version: they resolve to one package, and a
# stale pin here is invisible from the personae line.
identity = { package = "personae", version = "0.3.0", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
# The participant authority gate (participant gate B1/B3): document-host derives
# its import-level Grant from a servitor authority — one grant, two faces.
servitor = { version = "0.0.3", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# Path + version: the path is used for local workspace builds, the version lets
# a publishable dependent (stickleback) record the crates.io dependency.
muniment = { version = "0.2.1", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# Stored key-rooted contacts (the "them" side personae keeps): petnames, handles,
# per-endpoint trust, kith/kin tiers, recency. Relocated from repos/gaz 2026-08-10.
gaz = { version = "0.0.3", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
# The cast-list tier's facade reservation; empty until something imports it.
dramatis = { version = "0.0.5", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
dramatis-resident = { version = "0.0.1", git = "https://github.com/merely-made/dramatis.git", branch = "main", default-features = false }
# Dramatis as a projection producer (cards plus bounded action forms; contract crates only).
dramatis-surface = { version = "0.0.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
# The graded identity proofs and the never-shown secrets; reservations, no code.
insigne = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
chatelaine = { version = "0.0.3", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
# The custody route's application side (Armillary's djinn-slimming S3).
castellan-client = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main", default-features = false }

# Rhai backend for the knot block-evaluator lane (the thin BlockEvaluator
# slice, distinct from genet's full ScriptEngine seam). Pure Rust, sandboxed.
script-rhai = { version = "0.0.1", git = "https://github.com/merely-made/inker.git", branch = "main" }
script-wire = { version = "0.0.1", path = "../crates/script-wire" }
block-host = { version = "0.0.1", path = "crates/script/block-host" }
block-adapter = { version = "0.0.1", path = "crates/script/block-adapter", default-features = false }
authority-host = { version = "0.0.1", path = "crates/script/authority-host" }
vector-sheet = { version = "0.0.1", path = "../crates/vector-sheet" }
script-witgen = { version = "0.0.1", path = "../crates/script-witgen" }
settings-wit = { version = "0.0.1", path = "crates/system/settings-wit" }

# ─── External pins ───────────────────────────────────────────────────────────
# Linebender visual stack — both aliases use the same maintained Classic
# package and revision, preserving one concrete Scene type across Sprigging,
# Pictograph and Netrender. The fork retains the owned renderer repairs on
# the upstream 0.11 release.
vello = { package = "netrender-vello", version = "0.11.0", git = "https://github.com/mark-ik/vello", branch = "mark-ik/all-vellos", default-features = false }
netrender_vello = { package = "netrender-vello", version = "0.11.0", git = "https://github.com/mark-ik/vello", branch = "mark-ik/all-vellos", default-features = false }
# 30.0.1 at least: 30.0.0 decodes a successful WebGPU error-scope pop through
# `JsOption`, which wasm-bindgen 0.2.126 and later read as an error, and panics
# (burn plan 13.37, 13.38).
wgpu = "30.0.1"
welding-0-15 = { package = "welding", version = "0.15.0", git = "https://github.com/merely-made/wgpu-weld.git", branch = "main", default-features = false, features = ["wgpu-30"] }
kurbo = "0.13"
peniko = "0.6"
# Genet's Parley fork, taken by git at the same revision genet-livery is pinned
# to: livery reaches the fork by path inside that checkout, so a registry parley
# beside it would put two copies of the same types in one graph. The key stays
# `parley` so consumers' `parley::` paths and feature lists are unchanged; the
# fork carries `AlignmentOptions::last_line_alignment` and
# `StyleProperty::TabSize`, which published parley 0.10.0 lacks at the same
# version number.
parley = { package = "genet-parley", version = "0.10.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
skrifa = "0.42"
color = "0.3"

# Input + accessibility + window plumbing.
accesskit = "0.25.1"
accesskit_windows = "0.35.1"
accesskit_unix = "0.24.0"
accesskit_macos = "0.27.1"
accesskit_winit = "0.34.1"
accesskit_consumer = "=0.39.1"
ui-events = "0.3"
dpi = "0.1.2"
raw-window-handle = "0.6"
winit = "0.30.13"
# The Win32 surface cambium-genet-winit-host reads snap and frame geometry
# through. Genet's version, carried with the host.
windows-sys = "0.61"

# Cross-cutting utilities that benefit from one-version alignment.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
# Shared Merely seed-palette derivation engine (OKLCH). registry's theme module
# derives the full ThemeTokenSet from a few seed colours via this. Published as
# `tinct` on crates.io; kept under the local alias `tincture` (Cargo `package =`)
# so consumers and every `use tincture::` stay unchanged. Same source as the
# `tinct` key above: one source, two keys, one package.
tincture = { package = "tinct", git = "https://github.com/merely-made/graphshell.git", branch = "main" }

# Off-grid mesh transport backend (optional, default-off). `retinue` is Mark's
# own from-scratch Rust Reticulum Network Stack implementation, wire-compatible
# with RNS 1.3.x (it replaces the stale Beechat `reticulum` 0.1 crate, which
# could not parse ratcheted announces from real RNS). Since the 2026-07-23 radio
# merge the repo is one workspace (retinue, tulle, sennet, tucket, firmware), so
# this is an immutable source-revision pin rather than a relative path.
retinue = { version = "0.3.0", git = "https://github.com/merely-made/murm.git", branch = "main" }
# Station commissioning now lives in Murm; resident NomadNet remains optional.

# Reticulum identity derivation: HKDF-SHA256 stretches Mere's 32-byte master seed
# into retinue's 64-byte dual-key private identity. retinue owns the X25519/RNG
# work, so the probe no longer needs x25519-dalek or a separate rand source.
hkdf = "0.13"
sha2 = "0.11"

# Moved to this workspace in P3 slice 1 (D36, D37).
ux-events = { path = "crates/system/ux-events" }
pelt-desktop = { path = "ports/pelt/desktop", default-features = false }
tabard-workshop = { path = "ports/tabard/workshop" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[patch."https://github.com/merely-made/graphshell.git"]
chirograph = { path = "../crates/chirograph" }
graphshell-client = { path = "../crates/graphshell-client" }
graphshell-endpoint = { path = "../crates/graphshell-endpoint" }
hest = { path = "../crates/hest" }
sceno = { path = "../crates/sceno" }
sceno-backdrops = { path = "../crates/sceno-backdrops" }
scenotime = { path = "../crates/scenotime" }
script-wire = { path = "../crates/script-wire" }
script-witgen = { path = "../crates/script-witgen" }
tinct = { path = "../crates/tinct" }
vector-sheet = { path = "../crates/vector-sheet" }

[patch.crates-io]
# Published producer contracts share the host workspace's concrete types.
sceno = { path = "../crates/sceno" }
scenotime = { path = "../crates/scenotime" }
scenograph = { path = "crates/cambium/scenes/scenograph" }
scenomise = { path = "crates/cambium/scenes/scenomise" }
graphshell-endpoint = { path = "../crates/graphshell-endpoint" }
incipit = { path = "crates/incipit" }
chirograph = { path = "../crates/chirograph" }
mere-surface-api = { path = "crates/system/surface-api" }
cambium = { path = "crates/cambium/cambium" }
# The custody contract and resident use the same OS peer fact types.
peer-facts = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", branch = "main" }
# Registry custody clients and Git-hosted Djinn share the same door types.
ostiary = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", branch = "main" }
# Registry Webcue and native Genet sessions share one canonical input vocabulary.
document-session-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# Reuse the Windows password class across cancellation and sequential prompts.
light-file-dialog = { path = "support/patches/light-file-dialog" }
eidetic = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
gemini-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
scroll-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
spartan-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
# gaz (dramatis) takes muniment from crates.io so dramatis never pins mere;
# this swaps in mere's own, so the graph holds one muniment and castellan's
# stores and gaz's agree on its types.
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
# cubek-matmul 0.3.1: retain packed Q4 execution on 48-KiB workgroup devices
# by reducing unit stage partitions after register partitions reach one.
# Remove when upstream selection admits the same bounded packed-weight rows.
cubek-matmul = { path = "support/patches/cubek-matmul" }
# Livery/Buckram select published genet-taffy 0.16 directly. No Git patch is
# needed; the registry source remains independent of the Genet checkout.
# No parley/fontique patch rows: as of genet 5ae30cad the forks are published as
# `genet-parley` and `genet-fontique`, so nothing in genet answers to the name
# `parley` and a patch row here would match no package and fail resolution.
# genet-livery reaches the fork by path inside the git checkout, and Mere's own
# `parley` workspace dep names the fork by package (see [workspace.dependencies]).

# Genet's optional script-engine-boa owns its exact Boa Git revision directly.
# Registry overrides here would be unused and would not redirect that Git pin.

# Physics in dev builds (physics catalog plan, ruled 2026-10-04, "Opt 3 in dev
# for physics"): one Density start took 146.5 s at the dev profile's
# opt-level 0 and 6.0 s with these six crates at 3, the pictograph suite
# 102.5 s and 12.6 s, with the rebuild after a one-line seiche edit unchanged
# and backtraces keeping file and line. graphshell-web's own manifest names the
# same six.

[profile.dev.package.seiche]
opt-level = 3

[profile.dev.package.rapier2d]
opt-level = 3

[profile.dev.package.parry2d]
opt-level = 3

[profile.dev.package.nalgebra]
opt-level = 3

[profile.dev.package.simba]
opt-level = 3

[profile.dev.package.glamx]
opt-level = 3
