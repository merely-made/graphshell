name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: >-
          cargo clippy
          -p cambium -p cambium-winit -p cambium-nematic -p sprigging
          --all-features --all-targets --
          -D warnings -A clippy::type-complexity
      - run: cargo test --workspace --all-features --all-targets

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo package -p meristem
      - run: cargo package -p sprigging
      - run: cargo package -p cambium --all-features
      - run: cargo package -p cambium-winit
      - run: cargo package -p cambium-nematic
