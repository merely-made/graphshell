# The parser-guest test fixture. Standalone workspace with its own toolchain pin, built to
# wasm32-wasip2 by the host's build.rs; the host tests load the artifact. A Mere-built
# fixture: no test in Mere loads any other project's guest.
[workspace]

[package]
rust-version = "1.97.1"
name = "parser-fixture-guest"
version = "0.0.1"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.58"
serde = { version = "1", features = ["derive"] }
cbor-core = { version = "0.10", features = ["serde"] }

[profile.release]
opt-level = "s"
strip = true
panic = "abort"
