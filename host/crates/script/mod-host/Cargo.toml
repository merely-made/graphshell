# The parser and viewer component hosts: the native side of the `parser-guest` and
# `viewer-guest` WIT worlds (mod projects MP7, D10, D34 to D36). A sibling of block-host and
# authority-host over the same `mere:script` contract (one WIT package, in the Graphshell
# repository, materialised at `crates/script/wit` by build.rs). It knows no page and no
# pane: bytes in, a decoded document or scene out, and a trap or refusal as a value.
[package]
name = "mod-host"
version = "0.0.1"
edition = "2021"

rust-version = "1.97.1"
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
# Run guests on Wasmtime's interpreter, Pulley, not its compiler (guest runtime plan D8).
pulley = ["block-host/pulley"]
# The fixture guests this crate builds for its own tests, exposed to other crates' tests
# (`mod_host::test_support`; engine split D121: the owner crate exposes it).
test-support = []

[dependencies]
# The WIT world lives in this package; its build script publishes the directory to this
# crate's build script as DEP_GRAPHSHELL_ENDPOINT_WIT. The crate itself is not used.
graphshell-endpoint = { workspace = true }
# The engine, watchdog and wasmtime version every guest host shares.
block-host = { workspace = true }
# The graph format a viewer reads, named once.
authority-host = { workspace = true }
# InstallRecord (pinning), the world check, the line diff and Quota, as the document world.
document-host = { version = "0.0.1", path = "../document-host" }
inker = { workspace = true }
sceno = { workspace = true }
vector-sheet = { workspace = true }
cbor-core = { workspace = true }
serde = { workspace = true }
toml = "1"
wasmtime = "51"
wasmtime-wasi = "51"
pollster = "1"

[dev-dependencies]
# This crate's own tests load the fixture guests through `test_support`.
mod-host = { path = ".", features = ["test-support"] }

[lints]
workspace = true
