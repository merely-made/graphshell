[package]
name = "mere-ipfs-reader"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Verified IPNS and UnixFS reads through a host-supplied block transport"

[dependencies]
cid = "0.11.3"
libp2p-identity = { version = ">=0.3.1", features = ["peerid"] }
percent-encoding = "2"
rust-ipns = { version = "0.9", features = ["ed25519", "rsa"] }
rust-unixfs = "0.6"
sha2 = "0.10"
url = "2"

[dev-dependencies]
pollster = "1"
