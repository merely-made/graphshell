[package]
name = "cambium-embed"
version = "0.0.0"
description = "Probe: Cambium scenes embedded in a caller-owned egui or iced toolkit, over cambium-rootstock's public surface"
edition.workspace = true
rust-version = "1.97.1"
license = "MPL-2.0"
repository.workspace = true
publish = false

[features]
default = []
egui = ["dep:egui", "dep:egui-wgpu", "dep:epaint"]
iced = ["dep:iced_wgpu"]

[dependencies]
cambium = { workspace = true }
cambium-rootstock = { workspace = true }
backstep = { workspace = true }
document-session-api = { workspace = true }
netrender = { workspace = true, features = ["vello-gpu"] }
wgpu = { workspace = true }
egui-wgpu = { version = "=0.36.2", default-features = false, optional = true }
egui = { version = "=0.36.2", default-features = false, optional = true }
epaint = { version = "=0.36.2", default-features = false, optional = true }
# Released iced 0.14 is on wgpu 27; this rev is the wgpu 30 supplier.
iced_wgpu = { git = "https://github.com/iced-rs/iced", rev = "ab336f6d6403d7206d82c7c2caa46143efde8284", default-features = false, optional = true }

[lints]
workspace = true
