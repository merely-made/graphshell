# Async guest for the Wasmtime-45 component-model-async maturity probe.
[package]
name = "wt-async-guest"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
