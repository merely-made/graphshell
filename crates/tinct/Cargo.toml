[package]
rust-version = "1.97.1"
name = "tinct"
version = "0.2.0"
edition = "2024"
description = "Perceptual (OKLCH) seed-to-palette derivation, plus a contrast-gated syntax-highlight palette, for the Merely family (Woodshed, Hocket, Mere). A theme is a few seed colours; the full palette is derived."
license = "MPL-2.0"
# Moved from mere's crates/cambium/tinct on 2026-11-07 (mere's engine split
# plan, D19); the inherited repository is now graphshell's.
repository.workspace = true
keywords = ["color", "theme", "palette", "oklch", "design-tokens"]
categories = ["gui", "graphics"]

[dependencies]
serde = { workspace = true }

[lints]
workspace = true
