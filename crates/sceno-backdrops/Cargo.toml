[package]
rust-version = "1.97.1"
name = "sceno-backdrops"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Portable, disclosed-data backdrop scenes (metre, fretboard, terrain, templated sequences) compiled to sceno scenes: geometry only, no analysis or product authority."
keywords = ["scene", "backdrop", "projection", "contract"]
categories = ["visualization", "data-structures"]

[dependencies]
sceno.workspace = true
serde = { version = "1.0.219", features = ["derive"] }
# `SceneInput::parse` reads disclosed JSON; sceno already depends on it.
serde_json = "1.0.140"

[dev-dependencies]
# A compiled backdrop scene opens as a scenotime snapshot.
scenotime.workspace = true

[lints]
workspace = true
