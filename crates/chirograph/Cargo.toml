[package]
rust-version = "1.97.1"
name = "chirograph"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Chirograph: the projection contract, executed in duplicate. Versioned, carrier-neutral messages by which an endpoint offers a scene, a resource, or an action, and a host asks for one -- named for the medieval deed written twice on a sheet and cut through the writing, so the two halves prove each other by matching."

[dependencies]
hest.workspace = true
# The card vocabulary, extracted 2026-08-14 and re-exported from here.
base64.workspace = true
blake3.workspace = true
cbor-core.workspace = true
sceno.workspace = true
scenotime.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
# Validates the vectors against wire/projection.cddl (D222). Dev-only: it decodes
# through ciborium internally, and production code uses only cbor-core.
cddl = "0.10.7"

[lints]
workspace = true
