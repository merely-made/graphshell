[package]
rust-version = "1.97.1"
name = "graphshell-endpoint"
version = "0.0.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Application-injected projection and intent boundary for Graphshell."
# The build script publishes the directory holding the WIT world (`DEP_GRAPHSHELL_ENDPOINT_WIT`)
# to dependents' build scripts: the world lives once, here.
links = "graphshell-endpoint"

[features]
default = []
projection = ["dep:chirograph"]
local = ["projection", "dep:serde", "dep:serde_json"]
network = ["projection", "dep:serde_json", "dep:tokio"]
stdio = ["projection", "dep:serde_json"]
# The projection session over mere:script's WIT (capability door D18, D19).
wit = ["projection", "dep:script-wire", "dep:script-witgen", "dep:ciborium", "dep:serde", "dep:sceno"]
# The ipc-channel transport N1's channels use.
wit-ipc = ["wit", "script-wire/ipc"]
# The fixture endpoint, gate and call script every binding is checked with.
wit-testkit = ["wit"]

[dependencies]
chirograph = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
script-wire = { workspace = true, optional = true }
ciborium = { version = "0.2", optional = true }
sceno = { workspace = true, optional = true }

[build-dependencies]
script-witgen = { workspace = true, optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), any(unix, windows)))'.dependencies]
tokio = { version = "1", features = ["io-util", "rt", "rt-multi-thread", "net", "time", "sync", "macros"], optional = true }

[dev-dependencies]
# Passes a provider's end over a channel, as N1 does (wit_carrier tests).
ipc-channel.workspace = true
sceno.workspace = true
scenotime.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "time"] }
wit-parser.workspace = true
vector-sheet.workspace = true

[lints]
workspace = true
