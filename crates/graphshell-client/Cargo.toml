[package]
rust-version = "1.97.1"
name = "graphshell-client"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-independent local curation state for Graphshell."

[dependencies]
chirograph.workspace = true
hest.workspace = true
sceno.workspace = true
scenotime.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["io-util"], optional = true }

[features]
# The native stream-to-lines pump (`pump`): an admitted Tokio stream as NDJSON
# lines for the line-driven sessions (transport agnosticism note, T3). Off by
# default, so the client keeps no runtime and stays wasm-clean.
pump = ["dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }

[lints]
workspace = true
