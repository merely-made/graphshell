fail_fast: true
repos:
  - repo: local
    hooks:
      - id: line-ceiling
        name: line ceiling
        entry: line-ceiling
        language: rust
        types: [text]
        always_run: true
        additional_dependencies: ["cli:https://github.com/merely-made/eidetic:line-ceiling-v0.0.2:line-ceiling"]
      - id: responsa-check
        name: responsa check
        entry: responsa check
        language: rust
        pass_filenames: false
        always_run: true
        additional_dependencies: ["cli:https://github.com/merely-made/eidetic:responsa-v0.0.3:responsa"]
