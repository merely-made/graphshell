[workspace]
resolver = "2"
members = [
    "crates/chirograph",
    "crates/graphshell-client",
    "crates/graphshell-endpoint",
    "crates/hest",
    "crates/sceno",
    "crates/sceno-backdrops",
    "crates/scenotime",
    "crates/script-wire",
    "crates/script-witgen",
]

[workspace.package]
rust-version = "1.97.1"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/graphshell"
authors = ["Mark AB (markik)"]

[workspace.dependencies]
# The protocol layer's own crates. Nothing here names Mere.
chirograph = { version = "0.0.4", path = "crates/chirograph" }
graphshell-client = { version = "0.0.2", path = "crates/graphshell-client" }
graphshell-endpoint = { version = "0.0.3", path = "crates/graphshell-endpoint" }
hest = { version = "0.2.1", path = "crates/hest" }
sceno = { version = "0.0.7", path = "crates/sceno" }
sceno-backdrops = { version = "0.0.1", path = "crates/sceno-backdrops" }
scenotime = { version = "0.0.5", path = "crates/scenotime" }
script-wire = { version = "0.0.1", path = "crates/script-wire" }
script-witgen = { version = "0.0.1", path = "crates/script-witgen" }

base64 = "0.22"
blake3 = "1"
ipc-channel = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
wit-parser = "=0.263.0"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"
